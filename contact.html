<body>

<div class="container py-5">
    
    <h1 class="text-center mb-5"  style="color: #1dd1a1;">Veuillez remplir ce formulaire pour me contacter</h1>

     <div class="row justify-content-center"> 
        <div class="col-md-8">
            <div class="card p-4 perso" style="background-color: rgba(255, 255, 255, 0.1);">
                <!-- clip-path: polygon(0% 0%, 100% 0%, 100% 75%, 75% 75%, 75% 100%, 50% 75%, 0% 75%);  -->
                <form id="contactForm">
                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="nom" placeholder="Votre nom" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="yamoto@gmail.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="sujet" class="form-label">Objet</label>
                        <input type="text" class="form-control" id="sujet" placeholder="Objet" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="5" placeholder="Votre message" required></textarea>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-send w-10">Envoyer <i class="fas fa-paper-plane"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Message de confirmation simulé -->
    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <div id="confirmationMessage" class="alert alert-success text-center d-none">
                Merci ! Votre message a été envoyé.
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Simulation de l'envoi du formulaire
document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Empêche l'envoi réel
    document.getElementById('confirmationMessage').classList.remove('d-none');
    // Réinitialisation du formulaire
    this.reset();
});
</script>
